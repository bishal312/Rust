[package]
name = "yt_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104" 
axum = "0.8.9"
clap = "4.6.7"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2.5.8"
