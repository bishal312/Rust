<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Video Downloader</title>
</head>

<body>
    <h1>Video Downloader</h1>
    <input id="url" placeholder="Paste a video URL" size="50">
    <button id="go">Get info</button>
    <pre id="out"></pre>
    <script>
        const out = document.getElementById("out");

        document.getElementById("go").addEventListener("click", async () => {
            out.textContent = "Loading...";
            try {
                const res = await fetch("/api/info", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: document.getElementById("url").value }),
                });
                if (!res.ok) {
                    out.textContent = await res.text();
                    return;
                }
                const info = await res.json();
                const mins = Math.floor(info.duration_seconds / 60);
                const secs = String(info.duration_seconds % 60).padStart(2, "0");

                out.textContent = [
                    `${info.title} - ${info.author}`,
                    `${mins}:${secs}  (client: ${info.client})`,
                    "",
                    ...info.formats.map((f) =>
                        [
                            String(f.itag).padStart(3),
                            f.kind.padEnd(5),
                            f.container.padEnd(4),
                            (f.quality ?? "-").padEnd(6),
                            f.codec.padEnd(16),
                            `${f.size_mb ?? "-"} MB`.padStart(10),
                            f.mp4_muxable ? "  mp4-muxable" : "",
                        ].join("  ")
                    ),
                ].join("\n");
            } catch (e) {
                out.textContent = "Request failed: " + e;
            }
        });
    </script>
</body>

</html>
